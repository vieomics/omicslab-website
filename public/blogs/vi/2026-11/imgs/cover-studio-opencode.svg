<svg width="1920" height="600" viewBox="0 0 1920 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Studio và OpenCode: cấp quyền cho coding agent mà không đưa token cho nó">
  <rect width="1920" height="600" fill="#fafafa"/>
  <line x1="0" y1="1" x2="1920" y2="1" stroke="#c6c6c6"/>
  <line x1="0" y1="599" x2="1920" y2="599" stroke="#c6c6c6"/>
  <line x1="1160" y1="0" x2="1160" y2="600" stroke="#e3e3e3"/>

  <text x="120" y="120" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="6" fill="#6c6c6c">STUDIO · CREDENTIAL BROKER · OPENCODE</text>
  <rect x="120" y="148" width="120" height="6" fill="#111111"/>

  <text x="120" y="268" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="94" font-weight="700" fill="#111111">Cấp quyền cho agent</text>
  <text x="120" y="366" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="94" font-weight="700" fill="#111111">mà không đưa token</text>
  <text x="120" y="464" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="94" font-weight="700" fill="#111111">cho nó</text>

  <text x="122" y="518" font-family="Inter, Arial, sans-serif" font-size="26" fill="#333333">Token nằm ở broker; agent chỉ thấy quyền được cấp.</text>
  <text x="122" y="560" font-family="Inter, Arial, sans-serif" font-size="17" letter-spacing="3" fill="#6c6c6c">HIỆN TẠI · MODEL MIỄN PHÍ · SẮP TỚI · PROVIDER TẠI VIỆT NAM</text>

  <!-- Right: session boundary -->
  <rect x="1220" y="92" width="600" height="424" fill="#ffffff" stroke="#c6c6c6" stroke-width="2"/>
  <text x="1250" y="128" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#6c6c6c">STUDIO SESSION</text>
  <line x1="1220" y1="146" x2="1820" y2="146" stroke="#e3e3e3"/>

  <!-- Agent box -->
  <rect x="1250" y="172" width="540" height="132" fill="#111111"/>
  <text x="1274" y="218" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">OpenCode</text>
  <text x="1274" y="250" font-family="Inter, Arial, sans-serif" font-size="16" fill="#c6c6c6">reads files · runs commands · calls tools</text>
  <text x="1274" y="278" font-family="Inter, Arial, sans-serif" font-size="15" fill="#c6c6c6">agent · không có token trong môi trường</text>

  <!-- Broker -->
  <rect x="1250" y="340" width="540" height="72" fill="#f0f0f0" stroke="#c6c6c6"/>
  <text x="1274" y="372" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111111">Credential broker</text>
  <text x="1274" y="397" font-family="Inter, Arial, sans-serif" font-size="15" fill="#6c6c6c">short-lived · scoped · injected per session</text>

  <!-- Arrow agent to broker -->
  <line x1="1520" y1="304" x2="1520" y2="336" stroke="#111111" stroke-width="3"/>
  <path d="M1512 326 L1520 340 L1528 326" fill="#111111"/>

  <!-- Token outside -->
  <rect x="1250" y="444" width="220" height="44" fill="#ffffff" stroke="#c6c6c6" stroke-dasharray="6 4"/>
  <text x="1268" y="472" font-family="Inter, Arial, sans-serif" font-size="15" fill="#6c6c6c">token / API key</text>
  <line x1="1470" y1="466" x2="1540" y2="412" stroke="#c6c6c6" stroke-dasharray="6 4"/>
  <text x="1550" y="470" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6c6c6c">ở phía broker, không vào agent</text>

  <text x="1520" y="552" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#6c6c6c">QUYỀN CỦA AGENT = QUYỀN CỦA TOKEN</text>
</svg>
