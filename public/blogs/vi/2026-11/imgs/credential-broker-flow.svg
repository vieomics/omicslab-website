<svg width="1200" height="1000" viewBox="0 0 1200 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luồng quyền trong Studio: OpenCode gọi credential broker, broker gắn token khi gọi Git, Platform API và LLM provider">
  <rect width="1200" height="1000" fill="#fafafa"/>
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#c6c6c6"/>
  <line x1="0" y1="999" x2="1200" y2="999" stroke="#c6c6c6"/>

  <text x="50" y="58" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#6c6c6c">LUỒNG QUYỀN · STUDIO</text>
  <text x="50" y="94" font-family="Inter, Arial, sans-serif" font-size="27" fill="#333333">Agent không giữ token; broker gắn quyền khi gọi dịch vụ.</text>

  <!-- Session boundary -->
  <rect x="50" y="130" width="1100" height="250" fill="#ffffff" stroke="#c6c6c6" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="76" y="164" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="4" fill="#6c6c6c">STUDIO SESSION</text>

  <rect x="76" y="184" width="1048" height="150" fill="#111111"/>
  <text x="102" y="232" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">OpenCode</text>
  <text x="102" y="268" font-family="Inter, Arial, sans-serif" font-size="21" fill="#c6c6c6">đọc file · chạy lệnh · gọi tool</text>
  <text x="102" y="300" font-family="Inter, Arial, sans-serif" font-size="20" fill="#c6c6c6">agent · không có token trong môi trường</text>

  <!-- Broker -->
  <rect x="76" y="430" width="1048" height="130" fill="#111111"/>
  <text x="102" y="476" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">CREDENTIAL BROKER</text>
  <text x="102" y="510" font-family="Inter, Arial, sans-serif" font-size="20" fill="#c6c6c6">short-lived · scoped · injected per session</text>
  <text x="102" y="538" font-family="Inter, Arial, sans-serif" font-size="18" fill="#c6c6c6">token ở phía sau, không vào agent</text>

  <!-- Arrow agent to broker -->
  <line x1="600" y1="380" x2="600" y2="422" stroke="#111111" stroke-width="4"/>
  <path d="M588 408 L600 428 L612 408" fill="#111111"/>

  <!-- Services -->
  <rect x="50" y="620" width="340" height="120" fill="#ffffff" stroke="#c6c6c6"/>
  <text x="72" y="662" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#111111">Git</text>
  <text x="72" y="696" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6c6c">clone · pull · push</text>
  <text x="72" y="722" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6c6c">trong scope</text>

  <rect x="430" y="620" width="340" height="120" fill="#ffffff" stroke="#c6c6c6"/>
  <text x="452" y="662" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#111111">Platform API</text>
  <text x="452" y="696" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6c6c">job · data · workspace</text>
  <text x="452" y="722" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6c6c">trong scope</text>

  <rect x="810" y="620" width="340" height="120" fill="#ffffff" stroke="#c6c6c6"/>
  <text x="832" y="662" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#111111">LLM provider</text>
  <text x="832" y="696" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6c6c">model do OpenCode chọn</text>
  <text x="832" y="722" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6c6c">khóa do broker giữ</text>

  <!-- Arrows broker to services -->
  <line x1="600" y1="560" x2="220" y2="612" stroke="#6c6c6c" stroke-width="3"/>
  <path d="M220 612 L234 602 M220 612 L236 616" stroke="#6c6c6c" stroke-width="3"/>
  <line x1="600" y1="560" x2="600" y2="612" stroke="#6c6c6c" stroke-width="3"/>
  <path d="M590 600 L600 616 L610 600" fill="#6c6c6c"/>
  <line x1="600" y1="560" x2="980" y2="612" stroke="#6c6c6c" stroke-width="3"/>
  <path d="M980 612 L964 602 M980 612 L964 616" stroke="#6c6c6c" stroke-width="3"/>

  <!-- Token note -->
  <rect x="50" y="790" width="520" height="70" fill="#ffffff" stroke="#c6c6c6" stroke-dasharray="7 5"/>
  <text x="72" y="820" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#111111">token / API key</text>
  <text x="72" y="844" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6c6c6c">ở phía broker, không vào agent</text>

  <!-- Permission rule -->
  <rect x="620" y="790" width="530" height="70" fill="#111111"/>
  <text x="644" y="820" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Agent permission</text>
  <text x="644" y="844" font-family="Inter, Arial, sans-serif" font-size="18" fill="#c6c6c6">= token permission</text>

  <text x="50" y="920" font-family="Inter, Arial, sans-serif" font-size="20" fill="#333333">Agent chỉ thấy endpoint và quyền được cấp.</text>
  <text x="50" y="952" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6c6c">Token không nằm trong repo, biến môi trường hay lịch sử shell.</text>
  <rect x="50" y="970" width="700" height="5" fill="#111111"/>
</svg>
