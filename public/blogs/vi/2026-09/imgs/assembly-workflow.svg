<svg width="1600" height="1080" viewBox="0 0 1600 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ba bước: giải trình tự, lắp ráp de novo, và so sánh với hệ gen tham chiếu để tìm biến thể">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <rect width="1600" height="1080" fill="#fafafa"/>
  <line x1="0" y1="380" x2="1600" y2="380" stroke="#e3e3e3"/>
  <line x1="0" y1="720" x2="1600" y2="720" stroke="#e3e3e3"/>

  <!-- ============ STEP 1: SEQUENCING ============ -->
  <circle cx="120" cy="120" r="32" fill="#111111"/>
  <text x="120" y="132" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#fafafa">1</text>
  <text x="180" y="112" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="36" font-weight="700" fill="#111111">Giải trình tự</text>
  <text x="180" y="150" font-family="Inter, Arial, sans-serif" font-size="19" fill="#6c6c6c">Cắt DNA thành hàng triệu mảnh ngắn (reads)</text>

  <text x="460" y="96" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6c6c6c">DNA / nhiễm sắc thể</text>
  <rect x="460" y="106" width="1040" height="18" rx="3" fill="#111111"/>
  <g stroke="#c6c6c6" stroke-width="1.5" stroke-dasharray="4 7">
    <line x1="560" y1="124" x2="560" y2="196"/>
    <line x1="700" y1="124" x2="700" y2="196"/>
    <line x1="840" y1="124" x2="840" y2="196"/>
    <line x1="980" y1="124" x2="980" y2="196"/>
    <line x1="1120" y1="124" x2="1120" y2="196"/>
    <line x1="1260" y1="124" x2="1260" y2="196"/>
    <line x1="1400" y1="124" x2="1400" y2="196"/>
  </g>

  <g>
    <rect x="460" y="200" width="150" height="14" fill="#6c6c6c"/>
    <rect x="640" y="200" width="95" height="14" fill="#111111"/>
    <rect x="765" y="200" width="180" height="14" fill="#6c6c6c"/>
    <rect x="975" y="200" width="120" height="14" fill="#c6c6c6"/>
    <rect x="1125" y="200" width="160" height="14" fill="#6c6c6c"/>
    <rect x="1315" y="200" width="90" height="14" fill="#111111"/>
    <rect x="1435" y="200" width="65" height="14" fill="#6c6c6c"/>

    <rect x="490" y="232" width="120" height="14" fill="#111111"/>
    <rect x="640" y="232" width="160" height="14" fill="#6c6c6c"/>
    <rect x="830" y="232" width="100" height="14" fill="#111111"/>
    <rect x="960" y="232" width="170" height="14" fill="#6c6c6c"/>
    <rect x="1160" y="232" width="130" height="14" fill="#111111"/>
    <rect x="1320" y="232" width="150" height="14" fill="#6c6c6c"/>

    <rect x="470" y="264" width="90" height="14" fill="#6c6c6c"/>
    <rect x="590" y="264" width="170" height="14" fill="#111111"/>
    <rect x="790" y="264" width="130" height="14" fill="#6c6c6c"/>
    <rect x="950" y="264" width="110" height="14" fill="#111111"/>
    <rect x="1090" y="264" width="180" height="14" fill="#6c6c6c"/>
    <rect x="1300" y="264" width="140" height="14" fill="#111111"/>
  </g>
  <text x="460" y="322" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6c6c6c">→ hàng triệu reads, mỗi read chỉ là một đoạn rất ngắn</text>

  <!-- ============ STEP 2: DE NOVO ASSEMBLY ============ -->
  <circle cx="120" cy="450" r="32" fill="#111111"/>
  <text x="120" y="462" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#fafafa">2</text>
  <text x="180" y="442" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="36" font-weight="700" fill="#111111">Lắp ráp de novo</text>
  <text x="180" y="480" font-family="Inter, Arial, sans-serif" font-size="19" fill="#6c6c6c">Ghép các đoạn chồng nhau lại</text>

  <rect x="470" y="420" width="380" height="16" fill="#c6c6c6"/>
  <rect x="660" y="452" width="400" height="16" fill="#c6c6c6"/>
  <rect x="520" y="484" width="380" height="16" fill="#c6c6c6"/>
  <rect x="780" y="516" width="320" height="16" fill="#c6c6c6"/>
  <rect x="780" y="420" width="70" height="112" fill="#111111" opacity="0.12"/>
  <line x1="760" y1="410" x2="800" y2="440" stroke="#6c6c6c" stroke-width="1.5"/>
  <text x="690" y="404" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6c6c6c">vùng chồng nhau</text>

  <line x1="900" y1="474" x2="985" y2="474" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1020" y="420" width="480" height="16" fill="#111111"/>
  <rect x="1020" y="452" width="340" height="16" fill="#6c6c6c"/>
  <rect x="1020" y="484" width="440" height="16" fill="#111111"/>
  <text x="1020" y="526" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6c6c6c">contigs</text>

  <text x="470" y="600" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6c6c">Không cần biết trước hệ gen trông thế nào — cách này gọi là lắp ráp de novo.</text>

  <!-- ============ STEP 3: REFERENCE COMPARISON ============ -->
  <circle cx="120" cy="800" r="32" fill="#111111"/>
  <text x="120" y="812" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#fafafa">3</text>
  <text x="180" y="792" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="36" font-weight="700" fill="#111111">So sánh &amp; tìm biến thể</text>
  <text x="180" y="830" font-family="Inter, Arial, sans-serif" font-size="19" fill="#6c6c6c">Đối chiếu với hệ gen đã biết</text>

  <text x="460" y="762" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6c6c6c">Hệ gen tham chiếu (đã biết)</text>
  <rect x="460" y="772" width="1040" height="18" rx="3" fill="#c6c6c6"/>
  <g stroke="#c6c6c6" stroke-width="1.5" stroke-dasharray="2 7">
    <line x1="700" y1="790" x2="700" y2="860"/>
    <line x1="700" y1="790" x2="700" y2="860"/>
    <line x1="880" y1="790" x2="880" y2="860"/>
    <line x1="1060" y1="790" x2="1060" y2="860"/>
    <line x1="1240" y1="790" x2="1240" y2="860"/>
    <line x1="1420" y1="790" x2="1420" y2="860"/>
  </g>
  <text x="460" y="906" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6c6c6c">Hệ gen của bạn</text>
  <rect x="460" y="862" width="1040" height="18" rx="3" fill="#111111"/>

  <circle cx="780" cy="825" r="9" fill="#fafafa" stroke="#111111" stroke-width="3"/>
  <circle cx="1150" cy="825" r="9" fill="#fafafa" stroke="#111111" stroke-width="3"/>
  <line x1="1159" y1="825" x2="1230" y2="800" stroke="#6c6c6c" stroke-width="1.5"/>
  <text x="1238" y="800" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6c6c6c">biến thể (SNP)</text>

  <circle cx="480" cy="952" r="9" fill="#fafafa" stroke="#111111" stroke-width="3"/>
  <text x="502" y="958" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6c6c6c">= vị trí khác biệt so với tham chiếu</text>
  <text x="460" y="1008" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6c6c">Vùng không có trong tham chiếu (gene mới) chỉ lộ ra khi lắp ráp de novo rồi chú giải.</text>
</svg>
