entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: DEBUG

certificatesResolvers:
  myresolver:
    acme:
      email: "admin@omicslab.io"
      storage: "/letsencrypt/acme.json"
      httpChallenge:
        entryPoint: web
