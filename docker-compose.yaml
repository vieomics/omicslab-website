services:
  omicslab:
    build: .
    container_name: omicslab-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.omicslab.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.omicslab.entrypoints=websecure"
      - "traefik.http.routers.omicslab.tls=true"
      - "traefik.http.routers.omicslab.tls.certresolver=myresolver"
      - "traefik.http.routers.omicslab.tls.domains=omicslab.io,www.omicslab.io"
      - "traefik.http.services.omicslab.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik-public"
    networks:
      - traefik-public
    depends_on:
      - traefik

  traefik:
    image: traefik:v2.10
    container_name: omicslab-traefik
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/acme.json:/letsencrypt/acme.json
    networks:
      - traefik-public

networks:
  traefik-public:
    name: traefik-public
    driver: bridge
