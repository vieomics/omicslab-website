services:
  omicslab:
    build: .
    container_name: omicslab-web
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.omicslab.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.omicslab.entrypoints=websecure"
      - "traefik.http.routers.omicslab.tls.certresolver=myresolver"
      - "traefik.http.services.omicslab.loadbalancer.server.port=3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    restart: unless-stopped
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      - traefik

  traefik:
    image: traefik:v3.5
    container_name: omicslab-traefik
    ports:
      - "80:80"
      - "443:443"
    environment:
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - acme:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      - omicslab
    restart: unless-stopped

volumes:
  acme:
