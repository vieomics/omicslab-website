name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Install Wrangler
        run: npm i -g wrangler

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9d588da6db7f8868a77394467f1b97ab
          preExistingWrangler: true
          command: pages deploy out --project-name=omicslab-website

      - name: Purge retired and updated policy URLs from the Cloudflare cache
        # Older deployments served the retired /security*, /pricing and
        # /solutions/infrastructure* pages (and the old, overbroad policy copy)
        # with s-maxage=604800, so legacy edge entries kept returning content
        # that no longer exists in the repo. Purge by URL prefix so every cached
        # variant (with/without trailing slash, .html, sub-paths) is cleared, and
        # refresh the current policy pages after each deploy. Falls back to a
        # full zone purge if the prefix request is rejected.
        # Non-fatal: if the token lacks Cache Purge permission the deploy still
        # succeeds and this step only logs a warning.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          ZONE_ID="${CLOUDFLARE_ZONE_ID:-}"
          if [ -z "$ZONE_ID" ]; then
            LOOKUP=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=omicslab.io" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            ZONE_ID=$(printf '%s' "$LOOKUP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('success') and d.get('result') else '')")
            if [ -z "$ZONE_ID" ]; then
              echo "::warning::Could not resolve the omicslab.io zone id; set the CLOUDFLARE_ZONE_ID repository variable (or grant the token Zone Read). Lookup response: $LOOKUP"
            fi
          fi
          if [ -z "$ZONE_ID" ]; then
            echo "Skipping cache purge."
            exit 0
          fi
          PURGE_URL="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache"
          PREFIXES='{"prefixes":[
            "omicslab.io/security",
            "omicslab.io/en/security",
            "omicslab.io/pricing",
            "omicslab.io/en/pricing",
            "omicslab.io/solutions/infrastructure",
            "omicslab.io/en/solutions/infrastructure",
            "omicslab.io/policies",
            "omicslab.io/en/policies",
            "omicslab.io/privacy",
            "omicslab.io/en/privacy",
            "omicslab.io/terms",
            "omicslab.io/en/terms"
          ]}'
          RESPONSE=$(curl -sS -X POST "$PURGE_URL" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PREFIXES")
          echo "Purge response: $RESPONSE"
          if printf '%s' "$RESPONSE" | grep -q '"success":true'; then
            echo "Purged cached URLs by prefix."
          else
            echo "::warning::Prefix purge was rejected; falling back to a full zone purge."
            FALLBACK=$(curl -sS -X POST "$PURGE_URL" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            echo "Fallback purge response: $FALLBACK"
          fi
